include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A malformed A2UI message must never take the app down, so we are
    # deliberate about where dynamic values are allowed to cross the boundary.
    # Everything past the parse layer is statically typed.
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - web/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
