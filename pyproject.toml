[project]
name = "barogroove"
version = "1.0.0"
description = "Your sky has a soundtrack. Weather's derivative, converted into a playlist that explains itself."
requires-python = ">=3.13"
readme = "README.md"
license = { text = "Apache-2.0" }

# Runtime dependencies are pinned in requirements.txt, which is what the
# Dockerfile installs. This block mirrors it for `pip install -e .` workflows.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "mcp>=1.2,<2.0",
]

[project.optional-dependencies]
# Everything that talks to Google Cloud. The app boots without any of it.
cloud = [
    "google-cloud-firestore>=2.19,<3.0",
    "google-cloud-secret-manager>=2.21,<3.0",
    "firebase-admin>=6.6,<7.0",
    "cryptography>=43.0",
    "PyJWT[crypto]>=2.9",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.urls]
Homepage = "https://bg.netdev.be"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `app.py` is a top-level module, deliberately: it is the inherited entry point
# and every deploy target expects `app:app`.
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["backend*", "fixtures*"]

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "network: touches a real upstream. Deselected by default; nothing in CI may need it.",
]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",  # Any is occasionally the honest type for upstream JSON.
    "B008",    # FastAPI's Depends() in defaults is the framework's idiom.
    "E501",    # line length is handled by the formatter.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These are all imported lazily and are absent in local dev by design.
module = ["google.cloud.*", "firebase_admin.*", "mcp.*"]
ignore_missing_imports = true
